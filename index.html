<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Station Model Study</title>
<style>
  /* Layout: full-bleed stage for the plaster model, view controls top-right, place navigation bottom centre. */
  :root {
    --stage: #d8d3cb;          /* warm grey seamless backdrop */
    --stage-night: #1b1f26;
    --ink: #1d1b18;            /* label text, near-black like the etched linework */
    --ink-soft: #5e5850;
    --card: rgba(246, 243, 238, 0.86);
    --rule: rgba(29, 27, 24, 0.16);
    --accent: #b3602d;         /* warm lamp amber, used for the active state */
    --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage: #2b2925; --stage-night: #14171c; --ink: #efebe4; --ink-soft: #b2aba0;
      --card: rgba(30, 28, 25, 0.82); --rule: rgba(239, 235, 228, 0.18); --accent: #e09a62;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --stage: #2b2925; --stage-night: #14171c; --ink: #efebe4; --ink-soft: #b2aba0;
    --card: rgba(30, 28, 25, 0.82); --rule: rgba(239, 235, 228, 0.18); --accent: #e09a62;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--font-display); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }


  .controls {
    position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 32px);
  }
  .seg { display: flex; align-items: stretch; border: 1px solid var(--glass-line, var(--rule)); background: var(--glass-strong, var(--card)); color: var(--glass-ink, inherit); }
  .seg button { color: inherit; }
  .seg .tag { font: 500 11px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); padding: 10px 4px 10px 12px; align-self: center; }
  button {
    font: 500 12px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); background: transparent; border: 0; padding: 10px 12px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--rule); }
  button[aria-pressed="true"] { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  button:disabled { color: var(--ink-soft); opacity: 0.5; cursor: default; box-shadow: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .status { position: fixed; inset: 0; display: grid; place-items: center; font: 12px var(--font-data); color: var(--ink-soft); pointer-events: none; }

  /* places: tooltip, optional markers, navigation bar inside a place */
  .tip { position: fixed; pointer-events: none; font: 500 11px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase;
         background: var(--card); border: 1px solid var(--rule); padding: 6px 9px; border-radius: 999px; transform: translate(-50%, -50%); white-space: nowrap; }
  .markers { position: fixed; inset: 0; pointer-events: none; }
  .marker { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 6px;
            font: 500 11px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink);
            background: var(--card); border: 1px solid var(--rule); padding: 6px 9px 6px 7px; border-radius: 999px; }
  .marker::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
         display: flex; align-items: stretch; border: 1px solid var(--rule); background: var(--card); backdrop-filter: blur(6px); }
  .nav button { min-width: 44px; min-height: 44px; }
  .nav button + button, .nav .where, .nav .where + button { border-left: 1px solid var(--rule); }
  .nav .where { font: 500 12px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; padding: 0 14px; display: grid; place-items: center; min-width: 110px; }

  /* sky lab panel (draft): sliders for the day cycle */
  .skypanel { position: fixed; right: 16px; top: calc(64px + env(safe-area-inset-top, 0px)); width: 290px; max-height: calc(100vh - 150px);
              overflow-y: auto; background: var(--card); border: 1px solid var(--rule); padding: 6px 14px 12px; font: 12px var(--font-data); }
  .sp-head { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 12px 0 4px; font-size: 11px; }
  .sp-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 6px 0; color: var(--ink); }
  .sp-row output { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .sp-row input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .sp-buttons { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .sp-buttons button { border: 1px solid var(--rule); padding: 8px 10px; }
  .sp-fps { margin-right: auto; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .skypanel { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-height: 55vh; } }
  /* ---- site GUI (Smo, 6 Oct 2026): name top left, menu top right on a see-through strip; the
     categories roll down inside the same strip; settings behind a small icon; content in a
     see-through panel over the scene. Light glass by day, dark glass at night. */
  :root { --glass: rgba(246, 243, 238, 0.58); --glass-strong: rgba(246, 243, 238, 0.86); --glass-line: rgba(255, 255, 255, 0.55);
          --glass-ink: #1d1b18; --glass-soft: #5e5850; --blur: blur(10px) saturate(1.15); }
  body.is-night { --glass: rgba(22, 24, 28, 0.5); --glass-strong: rgba(22, 24, 28, 0.84); --glass-line: rgba(255, 255, 255, 0.12);
                  --glass-ink: #f1ede6; --glass-soft: #b8b1a6; }
  .site { position: fixed; left: 0; right: 0; top: 0; z-index: 20; color: var(--glass-ink);
          background: var(--glass); border-bottom: 1px solid var(--glass-line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
          padding-top: env(safe-area-inset-top, 0px); transition: background 0.6s; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 40px; min-height: 48px; }
  /* name after Smo's reference: bold, a little extended, two lines set to the same width */
  .name { font: 700 23px/0.9 var(--font-display); font-stretch: 116%; font-variation-settings: 'wdth' 116; letter-spacing: 0.02em; text-transform: uppercase;
          color: inherit; text-decoration: none; display: inline-flex; flex-direction: column; align-items: flex-start; }
  .name span { display: inline-block; width: max-content; white-space: nowrap; }
  .menu { display: flex; gap: 6px; }
  .menu button, .menu-toggle { font: 400 12px/1 var(--font-display); font-stretch: 108%; font-variation-settings: 'wdth' 108; letter-spacing: 0.17em; text-transform: uppercase; color: inherit;
          padding: 12px 12px; min-height: 44px; position: relative; }
  .menu button[aria-expanded="true"]::after, .menu button.current::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 8px; height: 1px; background: currentColor; }
  .menu-toggle { display: none; }
  .drop { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.38s cubic-bezier(.2,.7,.2,1); }
  .drop.open { grid-template-rows: 1fr; }
  .drop-inner { overflow: hidden; }
  .drop-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 28px; padding: 6px 40px 26px; }
  .drop-item { display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; text-align: left; padding: 12px 0 10px; border-top: 1px solid var(--glass-line); color: inherit; text-transform: none; letter-spacing: 0; font: inherit; }
  .drop-item .t { display: block; font: 600 17px/1.2 var(--font-display); }
  .drop-item .s { display: block; font: 400 13px/1.4 var(--font-display); color: var(--glass-soft); margin-top: 3px; }
  .drop-item:hover .t, .drop-item:focus-visible .t { text-decoration: underline; text-underline-offset: 3px; }
  .drop-cat { display: none; }
  .gear { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 21; width: 44px; height: 44px; padding: 0;
          border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
          color: var(--glass-ink); display: grid; place-items: center; }
  .gear svg { width: 20px; height: 20px; }
  .controls { top: auto !important; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 21; flex-direction: column; align-items: flex-end; }
  .skypanel { top: calc(96px + env(safe-area-inset-top, 0px)) !important; z-index: 21; }
  .nav { z-index: 19; background: var(--glass) !important; border-color: var(--glass-line) !important; color: var(--glass-ink); -webkit-backdrop-filter: var(--blur); }
  .nav button { color: inherit; }
  .tip, .marker { background: var(--glass-strong); border-color: var(--glass-line); color: var(--glass-ink); }
  /* content: a small card when you arrive, a large panel when you read (the 3D pauses then) */
  .panel { box-sizing: border-box; }
  .kicker { font: 500 11px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--glass-soft); }
  .btn { font: 500 12px/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: inherit; border: 1px solid currentColor; padding: 12px 14px; min-height: 44px; }
  .btn.ghost { border-color: transparent; }
  .panel { position: fixed; z-index: 19; top: var(--hh, 77px); right: 0; bottom: 0; width: min(560px, 50vw); overflow-y: auto; color: var(--glass-ink);
           background: var(--glass-strong); border-left: 1px solid var(--glass-line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
           padding: 28px 40px 40px; transform: translateX(100%); transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .panel.open { transform: none; }
  body.panel-open .nav, body.panel-open .gear, body.panel-open .controls, body.panel-open .skypanel { display: none !important; }
  .panel h2 { font: 700 34px/1.05 var(--font-display); margin: 10px 0 14px; text-wrap: balance; }
  .panel .lead { font: 400 17px/1.5 var(--font-display); margin: 0 0 22px; }
  .panel .note { font: 400 12px/1.4 var(--font-data); color: var(--glass-soft); border-left: 2px solid currentColor; padding-left: 10px; margin: 0 0 24px; }
  .cards { display: grid; gap: 12px; margin-bottom: 26px; }
  .card { border-top: 1px solid var(--glass-line); padding-top: 12px; }
  .card .ph { aspect-ratio: 16 / 9; background: repeating-linear-gradient(135deg, rgba(127,127,127,.14) 0 10px, rgba(127,127,127,.06) 10px 20px); margin-bottom: 10px; }
  .card h3 { font: 600 17px/1.25 var(--font-display); margin: 0 0 4px; }
  .card p { font: 400 14px/1.45 var(--font-display); margin: 0; color: var(--glass-soft); }
  .panel-close { position: absolute; right: 24px; top: 14px; }
  .panel-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 720px) {
    .bar { padding: 12px 16px; }
    .name { font-size: 19px; }
    .menu { display: none; }
    .menu-toggle { display: block; padding-right: 0; }
    .drop-list { grid-template-columns: 1fr; padding: 0 16px 18px; gap: 0; }
    .drop-cat { display: block; font: 500 11px/1 var(--font-data); letter-spacing: 0.14em; text-transform: uppercase; color: var(--glass-soft); padding: 16px 0 6px; }
      .drop-list { max-height: calc(100vh - var(--hh, 70px) - 10px); overflow-y: auto; }
    .panel { width: 100vw; top: auto; height: calc(100% - var(--hh, 70px)); border-left: 0; border-top: 1px solid var(--glass-line); padding: 26px 18px 40px;
             transform: translateY(100%); }
    .panel.open { transform: none; }
    .panel-close { top: 14px; right: 10px; }
    .panel h2 { font-size: 28px; }
    .gear { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    .skypanel { top: auto !important; }
  }

  /* ---- every GUI element in the site style (Smo): glass, Archivo, spaced capitals ---- */
  :root { --font-data: "Archivo", "Helvetica Neue", Arial, sans-serif; }
  .ui-caps, .nav .where, .nav button, .seg button, .seg .tag, .tip, .marker, .kicker, .sp-head, .btn, .gear {
    font-family: var(--font-display); font-stretch: 108%; font-variation-settings: 'wdth' 108; text-transform: uppercase; letter-spacing: 0.16em; }
  .nav { border-radius: 0; border: 1px solid var(--glass-line) !important; background: var(--glass) !important; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .nav button, .nav .where { font-size: 11px; font-weight: 400; color: var(--glass-ink); }
  .nav button { font-size: 11px; font-weight: 400; }
  #nav-prev, #nav-next { font-size: 18px; letter-spacing: 0; min-width: 52px; }
  .nav .where { cursor: pointer; background: none; border: 0; padding: 0 22px; min-width: 150px; }
  .nav .where:hover { text-decoration: underline; text-underline-offset: 4px; }
  .nav button + button, .nav .where, .nav .where + button { border-left: 1px solid var(--glass-line) !important; }
  .tip, .marker { font-size: 10.5px; font-weight: 500; padding: 8px 12px; border-radius: 0; background: var(--glass-strong); border: 1px solid var(--glass-line);
                  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); color: var(--glass-ink); }
  .marker::before { width: 6px; height: 6px; background: currentColor; }
  .seg { border-radius: 0; background: var(--glass-strong) !important; border-color: var(--glass-line) !important; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .seg button, .seg .tag { font-size: 11px; font-weight: 400; color: var(--glass-ink); }
  .seg .tag { color: var(--glass-soft); }
  .seg button + button { border-left-color: var(--glass-line) !important; }
  button[aria-pressed="true"] { color: var(--glass-ink) !important; box-shadow: inset 0 -1px 0 currentColor; }
  .skypanel { background: var(--glass-strong) !important; border-color: var(--glass-line) !important; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
              color: var(--glass-ink); font-family: var(--font-display) !important; }
  .sp-head { color: var(--glass-soft); font-size: 10.5px; }
  .sp-row { color: var(--glass-ink); font-size: 12.5px; }
  .sp-row output, .sp-fps { color: var(--glass-soft); }
  .sp-row input { accent-color: var(--glass-ink); }
  .sp-buttons button { border-color: var(--glass-line); color: var(--glass-ink); font-family: var(--font-display); letter-spacing: 0.14em; }
  .kicker { font-size: 10.5px; font-weight: 500; letter-spacing: 0.18em; }
  .panel .note { font-family: var(--font-display); }
  .status { font-family: var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
  @media (max-width: 720px) { .panel { height: 62% !important; } }
</style>

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const GHOST_LAYER = 1;   // cut-away parts: seen by shadow cameras only
const host = document.getElementById('stage');
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const renderer = new THREE.WebGLRenderer({ antialias: true });
// quality (Smo saw 8 fps): never more than 1.5 device pixels per CSS pixel; the adaptive step
// further down lowers this and switches effects off when the frame rate stays low
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;        // was PCFSoft: soft filtering of the lamps' cube shadows cost the most at night
renderer.toneMapping = THREE.ACESFilmicToneMapping;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 1200);
// haze: the distant hills sit in it; near and far follow the camera distance so the station stays clear
scene.fog = new THREE.Fog(0xd8d3cb, 140, 420);
const HOME = { pos: new THREE.Vector3(37, 24, -75), target: new THREE.Vector3(-5, 12, 20) };   // lower (Smo): the hills, the dish and part of the turbine in view
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomSpeed = 7;            // three r160 divides scroll by 100 x pixel ratio, so retina Macs zoomed very slowly
controls.zoomToCursor = true;       // zoom towards what the pointer is over
controls.minDistance = 6;
controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI * 0.47;
controls.update();

// --- light
const hemi = new THREE.HemisphereLight(0xe6edf5, 0xcbbfae, 0.5);
scene.add(hemi);
const SUN = { front: new THREE.Vector3(40, 25, -22), back: new THREE.Vector3(34, 30, 34) };
const sun = new THREE.DirectionalLight(0xffdcb9, 3.2);
sun.position.copy(SUN.front);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);                 // was 4096: a quarter of the work per redraw
Object.assign(sun.shadow.camera, { left: -52, right: 52, top: 52, bottom: -52, near: 1, far: 160 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.025;
sun.shadow.camera.layers.enable(GHOST_LAYER);
scene.add(sun);
// soft studio fill from the viewer's side, no shadows: keeps the opened rooms readable
const fill = new THREE.DirectionalLight(0xf3efe8, 0.55);
fill.position.set(-6, 7, -16);
scene.add(fill);

// night lights: placed from the model's named parts, so new modules light up by themselves
const nightLights = [];
function warm(color, pos, power, dist, shadow) {
  const l = new THREE.PointLight(color, 0, dist, 1.6);
  l.position.copy(pos);
  l.userData.power = power;
  if (shadow) {
    l.castShadow = true;
    l.shadow.mapSize.set(1024, 1024);
    l.shadow.bias = -0.002;
    l.shadow.camera.layers.enable(GHOST_LAYER);
  }
  scene.add(l); nightLights.push(l);
  return l;

function stepSky(now) {
  const dt = skyState.last ? Math.max(0, Math.min(0.25, (now - skyState.last) / 1000)) : 0;
  skyState.last = now;
  if (SKY.playing) {
    SKY.time += dt / (SKY.cycleMin * 60);

  }

  office: { kicker: 'Work · Products', title: 'Products', line: 'Product management and case studies.', lead: 'Placeholder: how products were shaped, with whom, and what came of it.' },
  workshop: { kicker: 'Work · Technology & AI', title: 'Technology & AI', line: 'Prototypes, devices and AI work.', lead: 'Placeholder: technical projects, prototypes and work with machine learning.' },
  showroom: { kicker: 'Work · Media & installations', title: 'Media & installations', line: 'Immersive sound, projection and exhibitions.', lead: 'Placeholder: media works, installations and exhibitions.' },
  'new-module': { kicker: 'Work · In progress', title: 'Museum & curation', line: 'The module being built.', lead: 'Placeholder: what is being built next.' },
  hub: { kicker: 'About', title: 'Simon Winkler', line: 'Research, products, technology and media.', lead: 'Placeholder: a short bio, what connects the fields, and what is next.' },
  relay: { kicker: 'Contact', title: 'Get in touch', line: 'Email and links.', lead: 'Placeholder: email address, profiles and where to find more.', cards: 0 },
  cv: { kicker: 'About', title: 'CV', line: '', lead: 'Placeholder: the CV as a page and as a PDF download.', cards: 0 },
  station: { kicker: 'About', title: 'The station', line: '', lead: 'Placeholder: a station that moves and gains modules over time, like a career across several fields. Each building holds one kind of work; the camp, the dish and the relay hold the person.', cards: 0 },
};
const site = document.getElementById('site'), drop = document.getElementById('drop'), dropList = document.getElementById('drop-list');
function fitName() {
  const a = document.getElementById('name-1'), b = document.getElementById('name-2');
  a.style.letterSpacing = ''; b.style.letterSpacing = '';
  const [s, l] = a.offsetWidth < b.offsetWidth ? [a, b] : [b, a];
  const n = s.textContent.length - 1, extra = (l.offsetWidth - s.offsetWidth) / n;
  s.style.letterSpacing = `calc(0.02em + ${extra}px)`; s.style.marginRight = `-${extra}px`;   // no extra space after the last letter
}
fitName(); document.fonts && document.fonts.ready.then(fitName); window.addEventListener('resize', fitName);
const measureHeader = () => document.documentElement.style.setProperty('--hh', document.querySelector('.site .bar').offsetHeight + 1 + 'px');
measureHeader(); window.addEventListener('resize', measureHeader); document.fonts && document.fonts.ready.then(measureHeader);
let dropCat = null, dropTimer = 0;
const phoneMenu = () => matchMedia('(max-width: 720px)').matches;
function renderDrop(cat) {
  const cats = cat === 'all' ? ['work', 'play', 'about', 'contact'] : [cat];
  dropList.innerHTML = '';
  cats.forEach((c) => {
    if (cat === 'all') { const h = document.createElement('div'); h.className = 'drop-cat'; h.textContent = c; dropList.appendChild(h); }
    const items = c === 'contact' ? [{ place: 'relay', t: 'Get in touch', s: 'Email and links' }] : MENU[c];
    items.forEach((it) => {
      const b = document.createElement('button'); b.className = 'drop-item';
      b.innerHTML = `<span class="t">${it.t}</span><span class="s">${it.s}</span>`;
      b.addEventListener('click', () => { closeDrop(); go(it); });
      b.addEventListener('mouseenter', () => { const p = it.place && PLACES.find((q) => q.id === it.place); if (p && !nav.place) showTip(p); });
      b.addEventListener('mouseleave', () => setTip(null));
      dropList.appendChild(b);
    });
  });
}
function openDrop(cat) {
  clearTimeout(dropTimer);
  if (dropCat !== cat) renderDrop(cat);
  dropCat = cat; drop.classList.add('open');
  document.querySelectorAll('#menu button').forEach((b) => b.setAttribute('aria-expanded', String(b.dataset.cat === cat)));
  document.getElementById('menu-toggle').setAttribute('aria-expanded', String(cat === 'all'));
}
function closeDrop() {
  drop.classList.remove('open'); dropCat = null; setTip(null);
  document.querySelectorAll('#menu button').forEach((b) => b.setAttribute('aria-expanded', 'false'));
  document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
}
document.querySelectorAll('#menu button').forEach((b) => {
  b.addEventListener('mouseenter', () => { if (matchMedia('(hover: hover)').matches) openDrop(b.dataset.cat); });
  b.addEventListener('click', () => (dropCat === b.dataset.cat ? closeDrop() : openDrop(b.dataset.cat)));
});
site.addEventListener('mouseleave', () => { dropTimer = setTimeout(closeDrop, 250); });
site.addEventListener('mouseenter', () => clearTimeout(dropTimer));
document.getElementById('menu-toggle').addEventListener('click', () => (dropCat ? closeDrop() : openDrop('all')));
document.getElementById('home-link').addEventListener('click', (e) => { e.preventDefault(); closeDrop(); closePanel(); setRoute(''); });
function go(it) {
  if (it.place) { if (nav.place && nav.place.id === it.place) openPanel(it.place); else setRoute(it.place); }
  else if (it.content) openPanel(it.content);
}
// content: the panel opens when the camera arrives (Smo: no small card first); while it is open the 3D pauses
const panel = document.getElementById('panel');
function openPanel(id) {
  const c = PAGES[id]; if (!c) return;
  const n = c.cards === 0 ? 0 : 3;
  const cards = Array.from({ length: n }, (_, i) => `<div class="card"><div class="ph"></div><h3>Project ${i + 1}</h3><p>Placeholder: one line about the project.</p></div>`).join('');
  document.getElementById('panel-body').innerHTML = `<div class="kicker">${c.kicker}</div><h2>${c.title}</h2><p class="lead">${c.lead}</p>
    <p class="note">Placeholder content. Real texts, images and videos follow.</p><div class="cards">${cards}</div>
    <div class="panel-actions"><a class="btn" href="#" onclick="return false">Open as page ↗</a></div>`;
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); panel.scrollTop = 0; document.body.classList.add('panel-open');
  closeDrop();
  setTimeout(() => { if (panel.classList.contains('open')) setPaused(true); }, 470);              // pause once the panel has slid in
}
function closePanel() {
  if (!panel.classList.contains('open')) return;
  setPaused(false);
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); document.body.classList.remove('panel-open');
}
document.getElementById('panel-close').addEventListener('click', closePanel);
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && panel.classList.contains('open')) { e.stopImmediatePropagation(); closePanel(); } }, true);
// settings icon: the old buttons (day/night, roof, places, sky, reset)
const settingsBox = document.querySelector('.controls');
settingsBox.hidden = true;
document.getElementById('gear').addEventListener('click', () => {
  settingsBox.hidden = !settingsBox.hidden;
  document.getElementById('gear').setAttribute('aria-expanded', String(!settingsBox.hidden));
  if (settingsBox.hidden) { document.getElementById('skypanel').hidden = true; press('btn-sky', false); }
});

// --- day / night: the sky cycle (stepSky) sets the light continuously and switches `mode` at dusk
// and dawn; apply() handles the switches that are either on or off
let mode = 'day';
const press = (id, on) => document.getElementById(id).setAttribute('aria-pressed', String(on));
function apply() {
  const night = mode === 'night';
  document.body.classList.toggle('is-night', night);
  press('btn-day', !night); press('btn-night', night);
  if (PROJ.units.length && (PROJ.to === 1) !== night) setProjectors(night);
  if (fire.mesh) { fire.mesh.visible = night; if (fire.light) fire.light.intensity = night ? 9 : 0; }
}
function paintBackground() { scene.background = null; }           // the sky sphere is the backdrop now
function jumpTo(t) {
  SKY.time = t; skyState.lastStep = -1e9;
  if (timeInput) { timeInput.value = t; timeLabel.textContent = clock(t); }
  saveSky();
}
document.getElementById('btn-day').addEventListener('click', () => jumpTo(0.42));
document.getElementById('btn-night').addEventListener('click', () => jumpTo(0.93));
document.getElementById('btn-reset').addEventListener('click', () => {
  if (nav.place) { setRoute(''); return; }
  const h = homePose(); camera.position.copy(h.pos); controls.target.copy(h.target); controls.update();
});
paintBackground();
apply();

// --- size and loop
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  if (!tween.active) camera.fov = baseFov();     // portrait screens: wider
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
function frame(now) {
  stepRoof(now); stepFire(now); stepBeacon(now); stepProjectors(now); stepTurbine(now);
  stepPlaces(now); stepSky(now); stepShowDark(now); stepPerson(now); stepPrinter(now); stepFps(now);
  const d = camera.position.distanceTo(controls.target);
  scene.fog.near = d + 50; scene.fog.far = d + 300;
  if (roof.start || PROJ.start) markShadows();                      // things that cast shadows are moving
  flushShadows(); stepQuality(now);
  composer.render();
}
// the 3D only pauses while a text or content panel is open (Smo); everything else keeps running
let paused = false;
function setPaused(on) {
  if (on === paused) return;
  paused = on;
  renderer.setAnimationLoop(on ? null : frame);
  if (!on) { quality.settle = performance.now() + 3000; }      // no quality step from the gap
}
renderer.setAnimationLoop(frame);

// hooks used for test renders
window.__set = (s) => { if (s.mode) jumpTo(s.mode === 'night' ? 0.93 : 0.42); if (s.time !== undefined) jumpTo(s.time); if (s.playing !== undefined) SKY.playing = s.playing; if (s.roof) setRoof(s.roof === 'closed', false); markShadows(); };
window.__moons = () => { const out = []; for (let i = 0; i < Math.round(SKY.moons); i++) out.push(skyUniforms.uMoonDir.value[i].toArray().map((n) => +n.toFixed(3))); out.push([SKY.time, skyState.days]); return out; };
window.__sky = (o) => { Object.assign(SKY, o || {}); applyAccents(); skyState.lastStep = -1e9; return { ...SKY, d: skyState.d, night: skyState.night }; };
window.__cam = (c) => { if (c.free) { controls.maxPolarAngle = Math.PI; controls.minDistance = 0.01; } camera.position.set(...c.pos); controls.target.set(...c.target); controls.update(); };
window.__go = (id) => setRoute(id || '');
window.__gui = { openDrop, closeDrop, openPanel, closePanel, state: () => ({ drop: dropCat, panel: panel.classList.contains('open'), paused }) };
window.__print = (u) => { PRN.t = u * PRN.printS; };
window.__lights = () => { const c = {}; scene.traverse((o) => { if (o.isLight) { const k = o.type + (o.castShadow ? '+shadow' : ''); c[k] = (c[k] || 0) + 1; } }); return JSON.stringify(c); };
window.__quality = (l) => { if (l !== undefined) setQuality(l); return quality.level; };
window.__personRun = (sec) => { let t = person.last || performance.now(); for (let k = 0; k < sec * 20; k++) { t += 50; stepPerson(t); } return { i: person.i, pos: person.root.position.toArray().map((n) => +n.toFixed(2)), boxAt: person.boxAt, carrying: person.carrying }; };
window.__look = (yawDeg, pitchDeg) => { look.yaw += yawDeg * Math.PI / 180; look.pitch = Math.max(-1.1, Math.min(1.1, look.pitch + (pitchDeg || 0) * Math.PI / 180)); };
window.__zoneScreen = (id) => { const p = PLACES.find((q) => q.id === id); const q = new THREE.Vector3(...p.zone.c).project(camera);
  const r = renderer.domElement.getBoundingClientRect(); return [r.left + (q.x + 1) / 2 * r.width, r.top + (1 - q.y) / 2 * r.height]; };
window.__state = () => ({ place: nav.place ? nav.place.id : null, mode: nav.mode, hash: location.hash, tween: tween.active, fov: camera.fov });
</script>
