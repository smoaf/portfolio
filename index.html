<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Station Model Study</title>
<style>
  /* Layout: full-bleed stage for the plaster model, view controls top-right, place navigation bottom centre. */
  :root {
    --stage: #d8d3cb;          /* warm grey seamless backdrop */
    --stage-night: #1b1f26;
    --ink: #1d1b18;            /* label text, near-black like the etched linework */
    --ink-soft: #5e5850;
    --card: rgba(246, 243, 238, 0.86);
    --rule: rgba(29, 27, 24, 0.16);
    --accent: #b3602d;         /* warm lamp amber, used for the active state */
    --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage: #2b2925; --stage-night: #14171c; --ink: #efebe4; --ink-soft: #b2aba0;
      --card: rgba(30, 28, 25, 0.82); --rule: rgba(239, 235, 228, 0.18); --accent: #e09a62;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --stage: #2b2925; --stage-night: #14171c; --ink: #efebe4; --ink-soft: #b2aba0;
    --card: rgba(30, 28, 25, 0.82); --rule: rgba(239, 235, 228, 0.18); --accent: #e09a62;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--font-display); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }


  .controls {
    position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 32px);
  }
  .seg { display: flex; align-items: stretch; border: 1px solid var(--rule); background: var(--card); backdrop-filter: blur(6px); }
  .seg .tag { font: 500 11px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); padding: 10px 4px 10px 12px; align-self: center; }
  button {
    font: 500 12px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); background: transparent; border: 0; padding: 10px 12px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--rule); }
  button[aria-pressed="true"] { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  button:disabled { color: var(--ink-soft); opacity: 0.5; cursor: default; box-shadow: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .status { position: fixed; inset: 0; display: grid; place-items: center; font: 12px var(--font-data); color: var(--ink-soft); pointer-events: none; }

  /* places: tooltip, optional markers, navigation bar inside a place */
  .tip { position: fixed; pointer-events: none; font: 500 11px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase;
         background: var(--card); border: 1px solid var(--rule); padding: 6px 9px; border-radius: 999px; transform: translate(-50%, -50%); white-space: nowrap; }
  .markers { position: fixed; inset: 0; pointer-events: none; }
  .marker { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 6px;
            font: 500 11px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink);
            background: var(--card); border: 1px solid var(--rule); padding: 6px 9px 6px 7px; border-radius: 999px; }
  .marker::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
         display: flex; align-items: stretch; border: 1px solid var(--rule); background: var(--card); backdrop-filter: blur(6px); }
  .nav button { min-width: 44px; min-height: 44px; }
  .nav button + button, .nav .where, .nav .where + button { border-left: 1px solid var(--rule); }
  .nav .where { font: 500 12px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; padding: 0 14px; display: grid; place-items: center; min-width: 110px; }

  /* sky lab panel (draft): sliders for the day cycle */
  .skypanel { position: fixed; right: 16px; top: calc(64px + env(safe-area-inset-top, 0px)); width: 290px; max-height: calc(100vh - 150px);
              overflow-y: auto; background: var(--card); border: 1px solid var(--rule); padding: 6px 14px 12px; font: 12px var(--font-data); }
  .sp-head { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 12px 0 4px; font-size: 11px; }
  .sp-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 6px 0; color: var(--ink); }
  .sp-row output { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .sp-row input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .sp-buttons { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .sp-buttons button { border: 1px solid var(--rule); padding: 8px 10px; }
  .sp-fps { margin-right: auto; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .skypanel { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-height: 55vh; } }
</style>

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const GHOST_LAYER = 1;   // cut-away parts: seen by shadow cameras only
const host = document.getElementById('stage');
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 1200);
// haze: the distant hills sit in it; near and far follow the camera distance so the station stays clear
scene.fog = new THREE.Fog(0xd8d3cb, 140, 420);
const HOME = { pos: new THREE.Vector3(37, 24, -75), target: new THREE.Vector3(-5, 12, 20) };   // lower (Smo): the hills, the dish and part of the turbine in view
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomSpeed = 7;            // three r160 divides scroll by 100 x pixel ratio, so retina Macs zoomed very slowly
controls.zoomToCursor = true;       // zoom towards what the pointer is over
controls.minDistance = 6;
controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI * 0.47;
controls.update();

// --- light
const hemi = new THREE.HemisphereLight(0xe6edf5, 0xcbbfae, 0.5);
scene.add(hemi);
const SUN = { front: new THREE.Vector3(40, 25, -22), back: new THREE.Vector3(34, 30, 34) };
const sun = new THREE.DirectionalLight(0xffdcb9, 3.2);
sun.position.copy(SUN.front);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -52, right: 52, top: 52, bottom: -52, near: 1, far: 160 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.025;
sun.shadow.camera.layers.enable(GHOST_LAYER);
scene.add(sun);
// soft studio fill from the viewer's side, no shadows: keeps the opened rooms readable
const fill = new THREE.DirectionalLight(0xf3efe8, 0.55);
fill.position.set(-6, 7, -16);
scene.add(fill);

// night lights: placed from the model's named parts, so new modules light up by themselves
const nightLights = [];
function warm(color, pos, power, dist, shadow) {
  const l = new THREE.PointLight(color, 0, dist, 1.6);
  l.position.copy(pos);
  l.userData.power = power;
  if (shadow) {
    l.castShadow = true;
    l.shadow.mapSize.set(1024, 1024);
    l.shadow.bias = -0.002;
    l.shadow.camera.layers.enable(GHOST_LAYER);
  }
  scene.add(l); nightLights.push(l);
  return l;
}
function placeNightLights(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3(), c = new THREE.Vector3();
  let shadows = 2;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const n = o.name;
    box.setFromObject(o); box.getCenter(c);
    if (/shell$/.test(n) && !/ghost|^tube/.test(n)) {   // glTF drops the '/' from names: 'libraryshell'
      // ceiling glow towards the back of the room, plus a spill onto the ground in front
      warm(0xffc48a, new THREE.Vector3(c.x, box.max.y - 0.9, c.z + 0.8), 13, 12, shadows-- > 0);
    } else if (/lamp$/.test(n)) {
      warm(0xffb36b, new THREE.Vector3(c.x, box.max.y - 0.2, c.z), 7, 7, false);
    } else if (/screens?$|computer_screen$|laptop$/.test(n)) {
      warm(0xd8e4ff, new THREE.Vector3(c.x, box.max.y + 0.2, c.z), 1.8, 4, false);
    } else if (/servers$/.test(n)) {
      warm(0xc9dcff, new THREE.Vector3(box.min.x - 0.6, c.y, c.z), 6, 6, false);
    }
  });
  apply();
}

// --- post: ambient occlusion makes plain plaster read
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
try {
  const gtao = new GTAOPass(scene, camera, 1, 1);
  gtao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1.2, scale: 1.0, samples: 16 });
  gtao.blendIntensity = 0.85;
  composer.addPass(gtao);
} catch (e) { /* runs without AO */ }
composer.addPass(new OutputPass());

// --- model
const status = document.getElementById('status');
const lightstrips = [];
const turbine = { rotor: null, q0: null, angle: 0, last: 0 };
function stepTurbine(now) {
  const r = turbine.rotor;
  if (!r) return;
  if (!turbine.q0) turbine.q0 = r.quaternion.clone();
  const dt = turbine.last ? Math.min(0.1, (now - turbine.last) / 1000) : 0;
  turbine.last = now;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  turbine.angle += dt * 1.1;                    // about 10 turns a minute
  r.quaternion.copy(turbine.q0).multiply(qTmp.setFromAxisAngle(xAxis, turbine.angle));
}
// --- projection mapping: three projectors fold out of ground boxes at night and light the
// showroom wall. One wide piece of content is split across the three beams.
const PROJ = { units: [], t: 0, from: 0, to: 0, start: 0, RISE: 1.0, MS: 2200 };
const CONTENT = (() => {                     // placeholder content, 3 × 512 px wide, drawn every frame
  const c = document.createElement('canvas'); c.width = 1536; c.height = 512;
  return { canvas: c, ctx: c.getContext('2d') };
})();
function drawContent(now) {
  const { ctx, canvas } = CONTENT, W = canvas.width, H = canvas.height, t = now / 1000;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, W, 0);
  const s = (Math.sin(t * 0.25) + 1) / 2;
  g.addColorStop(0, `hsl(${200 + 40 * s}, 70%, 45%)`);
  g.addColorStop(0.5, `hsl(${30 + 20 * s}, 85%, 55%)`);
  g.addColorStop(1, `hsl(${280 - 40 * s}, 60%, 45%)`);
  ctx.globalAlpha = 0.85; ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 16) ctx.lineTo(x, H * 0.55 + Math.sin(x / 140 + t * 0.9) * H * 0.18 + Math.sin(x / 57 - t * 1.7) * H * 0.05);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.5; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  for (let x = ((t * 40) % 64); x < W; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 32; y < H; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.globalAlpha = 1;
  PROJ.units.forEach((u, i) => {           // each beam takes its third, edges feathered for blending
    const p = u.ctx;
    p.drawImage(CONTENT.canvas, i * 512, 0, 512, 512, 0, 0, 512, 512);
    const fade = p.createRadialGradient(256, 256, 150, 256, 256, 256);
    fade.addColorStop(0, 'rgba(0,0,0,0)'); fade.addColorStop(1, 'rgba(0,0,0,1)');
    p.fillStyle = fade; p.fillRect(0, 0, 512, 512);
    u.tex.needsUpdate = true;
  });
}
function setupProjectors(root) {
  const byName = {};
  root.traverse((o) => { if (o.isMesh) byName[o.name] = o; });
  for (let i = 0; i < 3; i++) {
    const head = byName['showroomprojector_head_' + i], lid = byName['showroomprojector_lid_' + i];
    const target = byName['showroomprojector_target_' + i];
    if (!head || !lid || !target) continue;
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const spot = new THREE.SpotLight(0xffffff, 0, 16, 0.5, 0.25, 1.2);
    spot.map = tex;
    spot.castShadow = true;                 // three needs a shadow map to project a texture
    spot.shadow.mapSize.set(512, 512);
    spot.shadow.bias = -0.002;
    const tp = new THREE.Vector3(); new THREE.Box3().setFromObject(target).getCenter(tp);
    spot.target.position.copy(tp);
    scene.add(spot, spot.target);
    PROJ.units.push({ head, lid, spot, tex, ctx: c.getContext('2d'), y0: head.position.y, q0: lid.quaternion.clone() });
  }
  drawProjectors(0);
}
function drawProjectors(k) {               // k: 0 folded away, 1 out and projecting
  const lidK = Math.min(1, k / 0.35), liftK = Math.min(1, Math.max(0, (k - 0.3) / 0.5)), beamK = Math.max(0, (k - 0.82) / 0.18);
  const ease = (u) => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  PROJ.units.forEach((u) => {
    u.lid.quaternion.copy(u.q0).multiply(qTmp.setFromAxisAngle(xAxis, -1.95 * ease(lidK)));
    u.head.position.y = u.y0 + PROJ.RISE * ease(liftK);
    u.spot.position.copy(u.head.position);
    u.spot.intensity = 60 * beamK;
    u.head.visible = k > 0.01;
  });
}
function setProjectors(on, animate = true) {
  PROJ.from = PROJ.t; PROJ.to = on ? 1 : 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!animate || reduce) { PROJ.t = PROJ.to; drawProjectors(PROJ.t); PROJ.start = 0; markShadows(); return; }
  PROJ.start = performance.now();
}
function stepProjectors(now) {
  if (PROJ.start) {
    const u = Math.min(1, (now - PROJ.start) / PROJ.MS);
    PROJ.t = PROJ.from + (PROJ.to - PROJ.from) * u;
    drawProjectors(PROJ.t);
    if (u >= 1) { PROJ.start = 0; markShadows(); }
  }
  if (PROJ.t > 0.8) drawContent(now);
}
// red aviation lights (relay tower, wind turbine): dim red by day, blinking together at night
const beacons = [];
function setupBeacon() {
  beacons.forEach((b) => {
    const c = new THREE.Vector3();
    new THREE.Box3().setFromObject(b.mesh).getCenter(c);
    b.light = new THREE.PointLight(0xff2010, 0, 14, 1.8);
    b.light.position.copy(c);
    scene.add(b.light);
  });
}
function stepBeacon(now) {
  const on = mode === 'night' ? (Math.sin(now / 1000 * Math.PI * 1.0) > 0.3 ? 1 : 0.08) : 0.6;
  beacons.forEach((b) => {
    b.mesh.material.emissiveIntensity = mode === 'night' ? 3.2 * on : 0.6;
    if (b.light) b.light.intensity = mode === 'night' ? 6 * on : 0;
  });
}

// terrain fades out at its outer edges and towards the bottom of the cliff, into the backdrop
const FADE = { centre: new THREE.Vector2(-5, 18), radii: new THREE.Vector2(88, 64), cliffTop: -3.0, cliffBottom: -24.0 };
// hills and what stands on them: fade at the sides, and (hills only) fade out at their base
function hazeFade(m, base = false, strength = 0.75) {
  m.transparent = true;
  m.customProgramCacheKey = () => `haze-${base}-${strength}`;
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vHazePos;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvHazePos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vHazePos;')
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
        float side = 1.0 - smoothstep(110.0, 230.0, abs(vHazePos.x + 5.0));
        float foot = ${base ? 'smoothstep(-2.0, 12.0, vHazePos.y)' : '1.0'};
        gl_FragColor.a *= side * foot * ${strength.toFixed(2)};`);
  };
  m.needsUpdate = true;
}

function addFade(m, reach = 1) {      // reach > 1 lets an object fade out further away than the ground
  m.transparent = true;
  m.depthWrite = true;
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uFadeC = { value: FADE.centre };
    sh.uniforms.uFadeR = { value: FADE.radii.clone().multiplyScalar(reach) };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vFadePos;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvFadePos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vFadePos;\nuniform vec2 uFadeC;\nuniform vec2 uFadeR;')
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
        float fadeEdge = 1.0 - smoothstep(0.55, 1.0, length((vFadePos.xz - uFadeC) / uFadeR));
        float fadeDown = smoothstep(${FADE.cliffBottom.toFixed(1)}, ${FADE.cliffTop.toFixed(1)}, vFadePos.y);
        gl_FragColor.a *= fadeEdge * fadeDown;`);
  };
  m.needsUpdate = true;
}
// fire in the pit: flames and a flickering light, only at night
const fire = { mesh: null, light: null };
function setupFire() {
  if (!fire.mesh) return;
  const b = new THREE.Box3().setFromObject(fire.mesh), c = new THREE.Vector3();
  b.getCenter(c);
  fire.mesh.geometry.computeBoundingBox();
  const g = fire.mesh.geometry, gc = new THREE.Vector3();
  g.boundingBox.getCenter(gc); gc.y = g.boundingBox.min.y;            // grow from the ground up
  g.translate(-gc.x, -gc.y, -gc.z); fire.mesh.position.add(gc);
  fire.light = new THREE.PointLight(0xff8a3d, 0, 11, 1.7);
  fire.light.position.set(c.x, b.max.y + 0.3, c.z);
  fire.light.castShadow = true;
  fire.light.shadow.mapSize.set(512, 512);
  fire.light.shadow.bias = -0.003;
  scene.add(fire.light);
}
function stepFire(now) {
  if (!fire.mesh || !fire.mesh.visible) return;
  const t = now / 1000;
  const f = 0.75 + 0.15 * Math.sin(t * 7.3) + 0.1 * Math.sin(t * 13.1 + 1.3) + 0.06 * Math.sin(t * 23.7);
  fire.light.intensity = 9 * f;
  fire.mesh.scale.set(1, 0.85 + 0.2 * f, 1);
  fire.mesh.rotation.y = Math.sin(t * 1.7) * 0.15;
}
// --- the showroom gets dark when its roof slats and window fins are closed (Smo). The closed slats
// and fins already keep the sun out; this also fades the sky and environment light inside the

    const m = o.name.match(/^showroom(louver|fin)_(\d+)/);

  roof.slats.forEach((s) => { s.order = s.fin ? s.i / Math.max(1, nf - 1) : s.i / Math.max(1, nl - 1); });

  roof.slats.forEach((s) => { s.from = s.angle; s.to = closed ? 0 : s.open; });

    view: { type: 'inside', eye: [-20.4, 4.65, -2.8], look: [-23.6, 4.3, 0.6], fov: 72 } },

    view: { type: 'inside', eye: [-14.6, 4.65, 9.6], look: [-14.5, 4.4, 14.3], fov: 72 },
    onEnter: () => { if (roof.closed) setRoof(false); } },
  { id: 'new-module', name: 'New module', zone: { c: [-7.6, 3.5, 28.7], r: 8.5 },
    view: { type: 'object', pos: [8.0, 11.0, 14.0], target: [-7.6, 3.5, 28.7], az: 60, polar: [40, 85], dist: [10, 35], fit: 18 } },
  { id: 'dish', name: 'Radio dish', zone: { c: [15.0, 33.0, 154.0], r: 26 },
    view: { type: 'object', pos: [1.0, 57.0, 72.0], target: [15.0, 42.0, 150.0], az: 80, polar: [45, 88], dist: [30, 120], fit: 50 } },
  { id: 'relay', name: 'Relay station', zone: { c: [46.0, 9.0, 31.0], r: 11 },
    view: { type: 'object', pos: [30.0, 13.0, 4.0], target: [46.0, 8.0, 31.0], az: 80, polar: [40, 86], dist: [15, 50], fit: 22 } },
  { id: 'camp', name: 'Camp', zone: { c: [25.4, 1.5, -5.4], r: 5.5 },
    view: { type: 'object', pos: [17.0, 6.5, -19.0], target: [25.2, 1.2, -5.2], az: 70, polar: [40, 86], dist: [8, 28], fit: 12 } },
  { id: 'workshop', name: 'Workshop', zone: { c: [10.85, 4.4, 0.0], r: 5.6 },
    view: { type: 'cutaway', pos: [10.85, 6.2, -13.0], target: [10.85, 4.3, 0.2], az: 35, polar: [62, 88], dist: [6, 18], fit: 11.5 } },
  { id: 'office', name: 'Office', zone: { c: [-0.8, 4.4, 0.0], r: 5.6 },
    view: { type: 'cutaway', pos: [-0.8, 6.2, -13.0], target: [-0.8, 4.3, 0.2], az: 35, polar: [62, 88], dist: [6, 18], fit: 11.5 } },
  { id: 'library', name: 'Library', zone: { c: [-11.6, 4.4, 0.0], r: 5.6 },
    view: { type: 'cutaway', pos: [-11.6, 6.2, -12.5], target: [-11.6, 4.3, 0.2], az: 35, polar: [62, 88], dist: [6, 17], fit: 10.5 } },
];

const nav = { place: null, mode: 'overview' };            // mode: overview | cutaway | object | inside
const tween = { active: false };
const look = { yaw: 0, pitch: 0, eye: new THREE.Vector3(), pointers: new Map(), pinch: 0, fov0: 0, fov: 72 };
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const portrait = () => host.clientWidth < host.clientHeight;
function baseFov() {
  if (nav.mode === 'inside') return look.fov;
  return portrait() ? 50 : 32;
}
// on narrow screens, step back along the view line until `fit` metres of width are in frame
const HOME_FIT = 64;
function fitPose(pos, target, fit) {
  const p = pos.clone(), t = target.clone();
  if (!fit) return { pos: p, target: t, d: p.distanceTo(t) };
  const vf = THREE.MathUtils.degToRad(portrait() ? 50 : 32), aspect = host.clientWidth / host.clientHeight;
  const need = (fit / 2) / Math.tan(Math.atan(Math.tan(vf / 2) * aspect));
  const off = p.clone().sub(t), d = off.length();
  if (need > d) p.copy(t).add(off.multiplyScalar(need / d));
  return { pos: p, target: t, d: p.distanceTo(t) };
}
function homePose() { return fitPose(HOME.pos, HOME.target, HOME_FIT); }

// ---- picking: the zone whose centre lies closest to the pointer ray (relative to its size) wins
const zoneSpheres = PLACES.map((p) => new THREE.Sphere(new THREE.Vector3(...p.zone.c), p.zone.r));
function setRay(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function zoneAt(ev) {
  setRay(ev);
  let best = null, score = Infinity;
  PLACES.forEach((p, i) => {
    const s = zoneSpheres[i];
    if (!ray.ray.intersectsSphere(s)) return;
    const k = Math.sqrt(ray.ray.distanceSqToPoint(s.center)) / s.radius;
    if (k < score) { score = k; best = p; }
  });
  return best;
}
function hitRoof(ev) {
  setRay(ev);
  return ray.intersectObjects(roof.slats.map((s) => s.mesh), false).length > 0;
}

// ---- camera modes
function overviewControls() {
  Object.assign(controls, { enabled: true, enablePan: true, enableZoom: true, zoomToCursor: true, minDistance: 6, maxDistance: 160,
    minAzimuthAngle: -Infinity, maxAzimuthAngle: Infinity, minPolarAngle: 0, maxPolarAngle: Math.PI * 0.47 });
}
function placeControls(v) {
  const off = new THREE.Vector3(...v.pos).sub(new THREE.Vector3(...v.target));
  const az = Math.atan2(off.x, off.z), r = THREE.MathUtils.degToRad(v.az);
  const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
  Object.assign(controls, { enabled: true, enablePan: false, enableZoom: true, zoomToCursor: false,
    minDistance: v.dist[0], maxDistance: v.dist[1], minAzimuthAngle: wrap(az - r), maxAzimuthAngle: wrap(az + r),
    minPolarAngle: THREE.MathUtils.degToRad(v.polar[0]), maxPolarAngle: THREE.MathUtils.degToRad(v.polar[1]) });
}
function lookDir(out = new THREE.Vector3()) {
  return out.set(Math.sin(look.yaw) * Math.cos(look.pitch), Math.sin(look.pitch), Math.cos(look.yaw) * Math.cos(look.pitch));
}

// ---- flights between views
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
function flyTo(pos, target, fov, done) {
  Object.assign(tween, { active: true, start: performance.now(), ms: reduceMotion() ? 0 : 1200, done,
    p0: camera.position.clone(), t0: controls.target.clone(), f0: camera.fov, p1: pos, t1: target, f1: fov });
  controls.enabled = false;
}
function stepTween(now) {
  const u = tween.ms ? Math.min(1, (now - tween.start) / tween.ms) : 1, e = ease(u);
  camera.position.lerpVectors(tween.p0, tween.p1, e);
  controls.target.lerpVectors(tween.t0, tween.t1, e);
  camera.fov = tween.f0 + (tween.f1 - tween.f0) * e;
  camera.updateProjectionMatrix();
  camera.lookAt(controls.target);
  if (u >= 1) { tween.active = false; tween.done && tween.done(); }
}

function enter(p) {
  nav.place = p; nav.mode = p.view.type;
  document.body.classList.add('in-place');
  setTip(null);
  showNav(p);
  if (p.onEnter) p.onEnter();
  const v = p.view;
  if (v.type === 'inside') {
    const eye = new THREE.Vector3(...v.eye), at = new THREE.Vector3(...v.look);
    const d = at.clone().sub(eye).normalize();
    look.eye.copy(eye); look.yaw = Math.atan2(d.x, d.z); look.pitch = Math.asin(d.y); look.fov = portrait() ? v.fov + 8 : v.fov;
    flyTo(eye, eye.clone().add(d.multiplyScalar(0.5)), look.fov, () => {});
  } else {
    const f = fitPose(new THREE.Vector3(...v.pos), new THREE.Vector3(...v.target), v.fit);
    flyTo(f.pos, f.target, portrait() ? 50 : 32, () => { placeControls(v); controls.maxDistance = Math.max(v.dist[1], f.d * 1.2); });
  }
}
function leave() {
  nav.place = null; nav.mode = 'overview';
  document.body.classList.remove('in-place');
  document.getElementById('nav').hidden = true;
  const h = homePose();
  flyTo(h.pos, h.target, portrait() ? 50 : 32, () => overviewControls());
}
function showNav(p) {
  document.getElementById('nav').hidden = false;
  document.getElementById('nav-where').textContent = p.name;
}

// ---- routing: every place has its own address (#library); the browser's back button works
function setRoute(id) {
  const want = id ? '#' + id : '';
  try {
    if (location.hash !== want && !(want === '' && location.hash === '#')) { location.hash = id; return; }
  } catch (e) { /* hash not writable: route directly */ }
  route(id);
}
function route(id) {
  const p = PLACES.find((q) => q.id === id) || null;
  if (p === nav.place && !tween.active) return;
  if (p) enter(p); else if (nav.place) leave();
}
window.addEventListener('hashchange', () => route(location.hash.slice(1)));
function step(k) {
  const i = nav.place ? PLACES.indexOf(nav.place) : -1;
  setRoute(PLACES[(i + k + PLACES.length) % PLACES.length].id);
}
document.getElementById('nav-prev').addEventListener('click', () => step(-1));
document.getElementById('nav-next').addEventListener('click', () => step(1));
document.getElementById('nav-back').addEventListener('click', () => setRoute(''));
window.addEventListener('keydown', (ev) => {
  if (ev.target.closest && ev.target.closest('input, textarea')) return;
  if (ev.key === 'Escape' && nav.place) setRoute('');
  if (nav.place && ev.key === 'ArrowRight') step(1);
  if (nav.place && ev.key === 'ArrowLeft') step(-1);
});

// ---- pointer: tap to go, drag to rotate (or to look round when inside), pinch to zoom
let downAt = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', (ev) => {
  downAt = { x: ev.clientX, y: ev.clientY, t: performance.now() };
  if (nav.mode === 'inside' && !tween.active) {
    look.pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    el.setPointerCapture(ev.pointerId);
    if (look.pointers.size === 2) { const [a, b] = [...look.pointers.values()]; look.pinch = Math.hypot(a.x - b.x, a.y - b.y); look.fov0 = look.fov; }
  }
});
el.addEventListener('pointermove', (ev) => {
  if (nav.mode === 'inside' && look.pointers.has(ev.pointerId)) {
    const prev = look.pointers.get(ev.pointerId);
    if (look.pointers.size === 1) {                       // grab the view: it follows the finger
      const k = THREE.MathUtils.degToRad(camera.fov) / el.clientHeight;
      look.yaw += (ev.clientX - prev.x) * k;
      look.pitch = Math.max(-1.1, Math.min(1.1, look.pitch + (ev.clientY - prev.y) * k));
    }
    look.pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (look.pointers.size === 2) {
      const [a, b] = [...look.pointers.values()];
      look.fov = THREE.MathUtils.clamp(look.fov0 * look.pinch / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), 35, 85);
    }
    return;
  }
  if (ev.pointerType === 'mouse' && !ev.buttons) hover(ev);
});
const endPointer = (ev) => { look.pointers.delete(ev.pointerId); };
el.addEventListener('pointercancel', endPointer);
el.addEventListener('pointerup', (ev) => {
  endPointer(ev);
  if (!downAt || tween.active) { downAt = null; return; }
  const tap = Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y) < 6 && performance.now() - downAt.t < 600;
  downAt = null;
  if (!tap) return;
  if (!nav.place) { const p = zoneAt(ev); if (p) setRoute(p.id); return; }
  if (nav.place.id === 'showroom' && hitRoof(ev)) setRoof(!roof.closed);
});
el.addEventListener('wheel', (ev) => {
  if (nav.mode !== 'inside') return;
  ev.preventDefault();
  look.fov = THREE.MathUtils.clamp(look.fov * Math.exp(ev.deltaY * 0.001), 35, 85);
}, { passive: false });

// ---- hover tooltip (mouse only) and optional place markers
const tip = document.getElementById('tip');
// the hover label sits still over its place and only shows after the pointer has rested on the
// same place for a moment (Smo: labels were jumpy); the pointer cursor changes at once
const HOVER_DELAY = 650;
let hovered = null, hoverCand = null, hoverSince = 0;
function setTip(p) {
  if (p !== hoverCand) { hoverCand = p; hoverSince = performance.now(); hovered = null; tip.hidden = true; }
  el.style.cursor = p ? 'pointer' : '';
  if (!p) { hovered = null; tip.hidden = true; }
}
function showTip(p) { hovered = p; tip.textContent = p.name; tip.hidden = false; }
const anchor = (p, out) => out.set(p.zone.c[0], p.zone.c[1] + p.zone.r * 0.45, p.zone.c[2]);
let hoverPending = false;
function hover(ev) {
  if (hoverPending) return;
  hoverPending = true;
  requestAnimationFrame(() => {
    hoverPending = false;
    if (tween.active) return setTip(null);
    if (!nav.place) return setTip(zoneAt(ev));
    if (nav.place.id === 'showroom') { tip.hidden = true; el.style.cursor = hitRoof(ev) ? 'pointer' : ''; return; }
    setTip(null);
  });
}
el.addEventListener('pointerleave', () => setTip(null));
const markers = document.getElementById('markers');
const markerEls = PLACES.map((p) => {
  const m = document.createElement('button');
  m.className = 'marker'; m.textContent = p.name; m.type = 'button';
  m.addEventListener('click', () => setRoute(p.id));
  markers.appendChild(m);
  return m;
});
let showMarkers = false;
document.getElementById('btn-places').addEventListener('click', () => {
  showMarkers = !showMarkers;
  press('btn-places', showMarkers);
});
const vTmp = new THREE.Vector3();
function stepMarkers() {
  if (hoverCand && !hovered && !nav.place && !tween.active && performance.now() - hoverSince > HOVER_DELAY) showTip(hoverCand);
  if (hovered && !nav.place && !tween.active) {
    anchor(hovered, vTmp).project(camera);
    tip.style.left = ((vTmp.x + 1) / 2 * el.clientWidth) + 'px'; tip.style.top = ((1 - vTmp.y) / 2 * el.clientHeight) + 'px';
  } else if (hovered) setTip(null);
  const on = showMarkers && !nav.place && !tween.active;
  markers.hidden = !on;
  if (!on) return;
  const w = el.clientWidth, h = el.clientHeight;
  PLACES.forEach((p, i) => {
    anchor(p, vTmp).project(camera);
    const vis = vTmp.z < 1 && Math.abs(vTmp.x) < 1.05 && Math.abs(vTmp.y) < 1.05;
    markerEls[i].style.display = vis ? '' : 'none';
    if (vis) { markerEls[i].style.left = ((vTmp.x + 1) / 2 * w) + 'px'; markerEls[i].style.top = ((1 - vTmp.y) / 2 * h) + 'px'; }
  });
}

// ---- per frame
const dTmp = new THREE.Vector3();
function stepPlaces(now) {
  if (tween.active) stepTween(now);
  else if (nav.mode === 'inside') {
    camera.position.copy(look.eye);
    controls.target.copy(look.eye).add(lookDir(dTmp).multiplyScalar(0.5));
    camera.lookAt(controls.target);
    if (Math.abs(camera.fov - look.fov) > 0.01) { camera.fov = look.fov; camera.updateProjectionMatrix(); }
  } else controls.update();
  stepMarkers();
}
overviewControls();
{ const h = homePose(); camera.position.copy(h.pos); controls.target.copy(h.target); controls.update(); }
if (location.hash.length > 1) setTimeout(() => route(location.hash.slice(1)), 0);

// --- day / night: the sky cycle (stepSky) sets the light continuously and switches `mode` at dusk
// and dawn; apply() handles the switches that are either on or off
let mode = 'day';
const press = (id, on) => document.getElementById(id).setAttribute('aria-pressed', String(on));
function apply() {
  const night = mode === 'night';
  press('btn-day', !night); press('btn-night', night);
  if (PROJ.units.length && (PROJ.to === 1) !== night) setProjectors(night);
  if (fire.mesh) { fire.mesh.visible = night; if (fire.light) fire.light.intensity = night ? 9 : 0; }
}
function paintBackground() { scene.background = null; }           // the sky sphere is the backdrop now
function jumpTo(t) {
  SKY.time = t; skyState.lastStep = -1e9;
  if (timeInput) { timeInput.value = t; timeLabel.textContent = clock(t); }
  saveSky();
}
document.getElementById('btn-day').addEventListener('click', () => jumpTo(0.42));
document.getElementById('btn-night').addEventListener('click', () => jumpTo(0.93));
document.getElementById('btn-reset').addEventListener('click', () => {
  if (nav.place) { setRoute(''); return; }
  const h = homePose(); camera.position.copy(h.pos); controls.target.copy(h.target); controls.update();
});
paintBackground();
apply();

// --- size and loop
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  if (!tween.active) camera.fov = baseFov();     // portrait screens: wider
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
renderer.setAnimationLoop((now) => {
  stepRoof(now); stepFire(now); stepBeacon(now); stepProjectors(now); stepTurbine(now);
  stepPlaces(now); stepSky(now); stepShowDark(now); stepPerson(now); stepFps(now);
  const d = camera.position.distanceTo(controls.target);
  scene.fog.near = d + 50; scene.fog.far = d + 300;
  if (roof.start || PROJ.start) markShadows();                      // things that cast shadows are moving
  if (shadowDirty) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  composer.render();
});

// hooks used for test renders
window.__set = (s) => { if (s.mode) jumpTo(s.mode === 'night' ? 0.93 : 0.42); if (s.time !== undefined) jumpTo(s.time); if (s.playing !== undefined) SKY.playing = s.playing; if (s.roof) setRoof(s.roof === 'closed', false); markShadows(); };
window.__moons = () => { const out = []; for (let i = 0; i < Math.round(SKY.moons); i++) out.push(skyUniforms.uMoonDir.value[i].toArray().map((n) => +n.toFixed(3))); out.push([SKY.time, skyState.days, SKY.moonFrom, SKY.moonTilt, SKY.moonSpeed]); return out; };
window.__sky = (o) => { Object.assign(SKY, o || {}); skyState.lastStep = -1e9; return { ...SKY, d: skyState.d, night: skyState.night }; };
window.__cam = (c) => { if (c.free) { controls.maxPolarAngle = Math.PI; controls.minDistance = 0.01; } camera.position.set(...c.pos); controls.target.set(...c.target); controls.update(); };
window.__go = (id) => setRoute(id || '');
window.__personRun = (sec) => { let t = person.last || performance.now(); for (let k = 0; k < sec * 20; k++) { t += 50; stepPerson(t); } return { i: person.i, pos: person.root.position.toArray().map((n) => +n.toFixed(2)), boxAt: person.boxAt, carrying: person.carrying }; };
window.__look = (yawDeg, pitchDeg) => { look.yaw += yawDeg * Math.PI / 180; look.pitch = Math.max(-1.1, Math.min(1.1, look.pitch + (pitchDeg || 0) * Math.PI / 180)); };
window.__zoneScreen = (id) => { const p = PLACES.find((q) => q.id === id); const q = new THREE.Vector3(...p.zone.c).project(camera);
  const r = renderer.domElement.getBoundingClientRect(); return [r.left + (q.x + 1) / 2 * r.width, r.top + (1 - q.y) / 2 * r.height]; };
window.__state = () => ({ place: nav.place ? nav.place.id : null, mode: nav.mode, hash: location.hash, tween: tween.active, fov: camera.fov });
</script>
